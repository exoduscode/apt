name: Validate repository sources

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq reprepro shellcheck

      - name: Validate scripts
        run: shellcheck scripts/*.sh

      - name: Validate release manifest
        run: |
          jq --exit-status '
            type == "object" and length > 0 and
            all(.[];
              (.repository | type == "string" and length > 0) and
              .codename == "noble" and
              (.package | type == "string" and length > 0) and
              (.version | type == "string" and length > 0) and
              (.cli_version | type == "string" and length > 0) and
              .architecture == "all" and
              (.asset | type == "string" and endswith("_all.deb")) and
              (.sha256 | test("^[0-9a-f]{64}$"))
            )
          ' releases/manifest.json

      - name: Validate signing key fingerprint
        run: |
          test "$(gpg --batch --with-colons --show-keys keys/exoduscode-archive-keyring.gpg | awk -F: '$1 == "fpr" { print $10; exit }')" = "C85DDAF2A38CA242A745D9DE5A4025DA3610A2EC"

      - name: Check repository database
        run: reprepro -b repository check
