name: Validate repository sources

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      attestations: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev jq shellcheck

      - name: Validate scripts
        run: shellcheck scripts/*.sh

      - name: Validate release manifest
        run: |
          jq --exit-status '
            type == "object" and length > 0 and
            all(.[];
              (.repository | type == "string" and length > 0) and
              .codename == "noble" and
              (.package | type == "string" and length > 0) and
              (.version | type == "string" and length > 0) and
              (.cli_version | type == "string" and length > 0) and
              .architecture == "all" and
              (.asset | type == "string" and endswith("_all.deb")) and
              (.sha256 | test("^[0-9a-f]{64}$"))
            )
          ' releases/manifest.json

      - name: Validate signing key fingerprint
        run: |
          test "$(gpg --batch --with-colons --show-keys keys/exoduscode-archive-keyring.gpg | awk -F: '$1 == "fpr" { print $10; exit }')" = "C85DDAF2A38CA242A745D9DE5A4025DA3610A2EC"

      - name: Validate repository configuration
        run: |
          jq --exit-status '
            .origin == "ExodusCode" and
            .label == "ExodusCode" and
            .suite == "stable" and
            .codename == "noble" and
            .version == "24.04" and
            .architectures == ["amd64", "arm64"] and
            .components == ["main"] and
            .sign_with == "C85DDAF2A38CA242A745D9DE5A4025DA3610A2EC"
          ' repository/conf/release.json

      - name: Keep generated state off source branches
        run: |
          test -z "$(git ls-files repository/db repository/dists repository/pool)"

      - name: Test signed multi-version repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/test-gnupg"
          install -d -m 700 "$GNUPGHOME"
          gpg --batch --passphrase '' --quick-generate-key \
            'ExodusCode APT CI <ci@exoduscode.invalid>' rsa2048 sign 1d
          fingerprint=$(gpg --batch --with-colons --list-secret-keys | \
            awk -F: '$1 == "fpr" { print $10; exit }')

          test_repository="$RUNNER_TEMP/test-repository"
          mkdir -p "$test_repository/conf"
          jq --arg fingerprint "$fingerprint" '.sign_with = $fingerprint' \
            repository/conf/release.json >"$test_repository/conf/release.json"
          gpg --batch --export "$fingerprint" >"$RUNNER_TEMP/test-keyring.gpg"

          for tag in v0.1.3 v0.1.2; do
            package_directory="$RUNNER_TEMP/packages/$tag"
            deb=$(scripts/verify-release.sh "$tag" noble "$package_directory")
            APT_REPOSITORY_DIR="$test_repository" \
              scripts/publish-package.sh "$tag" noble "$deb"
          done

          TAG=v0.1.2 CODENAME=noble \
            scripts/test-repository.sh \
              "$test_repository" "$RUNNER_TEMP/test-keyring.gpg"
