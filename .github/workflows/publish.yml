name: Publish package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Approved upstream release tag
        required: true
        type: choice
        options:
          - v0.1.3
          - v0.1.2
      codename:
        description: Ubuntu distribution codename
        required: true
        type: choice
        options:
          - noble

permissions:
  contents: read

concurrency:
  group: apt-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - name: Checkout reviewed publishing code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Checkout immutable repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: apt-repository
          path: published
          fetch-depth: 0

      - name: Apply reviewed repository configuration
        id: configuration
        run: |
          rm -rf published/repository/conf
          cp -R repository/conf published/repository/conf
          if git -C published diff --quiet -- repository/conf; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev jq

      - name: Import protected signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          printf '%s' "$APT_GPG_PRIVATE_KEY" >"$RUNNER_TEMP/private-key.asc"
          gpg --batch --import "$RUNNER_TEMP/private-key.asc"
          printf 'allow-preset-passphrase\n' >"$GNUPGHOME/gpg-agent.conf"
          gpgconf --kill gpg-agent
          gpg-connect-agent /bye
          keygrip=$(gpg --batch --with-colons --with-keygrip --list-secret-keys \
            C85DDAF2A38CA242A745D9DE5A4025DA3610A2EC | \
            awk -F: '$1 == "grp" { print $10; exit }')
          /usr/lib/gnupg2/gpg-preset-passphrase --preset \
            --passphrase "$APT_GPG_PASSPHRASE" "$keygrip"
          echo "GNUPGHOME=$GNUPGHOME" >>"$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/private-key.asc"

      - name: Download and verify approved release
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deb=$(scripts/verify-release.sh \
            "${{ inputs.tag }}" "${{ inputs.codename }}" "$RUNNER_TEMP/package")
          echo "deb=$deb" >>"$GITHUB_OUTPUT"

      - name: Import package idempotently
        env:
          APT_REPOSITORY_DIR: published/repository
          APT_FORCE_REBUILD: ${{ steps.configuration.outputs.changed }}
        run: scripts/publish-package.sh "${{ inputs.tag }}" "${{ inputs.codename }}" "${{ steps.package.outputs.deb }}"

      - name: Validate signatures and installation on AMD64
        env:
          TAG: ${{ inputs.tag }}
          CODENAME: ${{ inputs.codename }}
        run: scripts/test-repository.sh published/repository keys/exoduscode-archive-keyring.gpg

      - name: Commit immutable repository state
        id: commit
        run: |
          git -C published config user.name github-actions[bot]
          git -C published config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C published add repository
          if git -C published diff --cached --quiet; then
            echo "Repository already contains the approved package"
          else
            git -C published commit -m "repo: publish ${{ inputs.tag }} for ${{ inputs.codename }}"
            git -C published push origin HEAD:apt-repository
          fi
          echo "commit=$(git -C published rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - name: Build Pages artifact
        run: scripts/build-site.sh site published/repository keys

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  validate-arm64:
    needs: publish
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout validation code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout published repository state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.commit }}
          path: published

      - name: Validate signatures and installation on ARM64
        env:
          TAG: ${{ inputs.tag }}
          CODENAME: ${{ inputs.codename }}
        run: scripts/test-repository.sh published/repository keys/exoduscode-archive-keyring.gpg

  deploy:
    needs:
      - publish
      - validate-arm64
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy signed repository to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
